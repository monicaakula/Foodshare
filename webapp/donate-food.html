<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>FoodShare - Donate Food</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #e8f5e9, #f8fff8);
        padding: 35px 20px;
        color: #222;
    }

    .header {
        max-width: 900px;
        margin: 0 auto 25px;
        background: linear-gradient(135deg, #2e7d32, #43a047);
        color: white;
        padding: 25px 30px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .brand {
        font-size: 28px;
        font-weight: bold;
    }

    .role {
        background: rgba(255, 255, 255, 0.18);
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 14px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    .title {
        text-align: center;
        margin-bottom: 25px;
    }

    .title h1 {
        color: #2e7d32;
        font-size: 36px;
        margin-bottom: 8px;
    }

    .title p {
        color: #666;
        font-size: 16px;
    }

    .form-card {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.09);
    }

    .section {
        margin-bottom: 25px;
    }

    .section-title {
        color: #2e7d32;
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e6e6e6;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .field {
        margin-bottom: 5px;
    }

    .full {
        grid-column: 1 / -1;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #d0d0d0;
        border-radius: 9px;
        font-size: 15px;
        outline: none;
        background: white;
    }

    textarea {
        resize: vertical;
        min-height: 110px;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #43a047;
        box-shadow: 0 0 5px rgba(67, 160, 71, 0.18);
    }

    input[type="file"] {
        padding: 10px;
        background: #fafafa;
    }

    .hint {
        margin-top: 6px;
        color: #888;
        font-size: 12px;
    }

    .submit {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #2e7d32;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    .submit:hover {
        background: #1b5e20;
    }

    .back {
        display: block;
        width: 220px;
        margin: 22px auto 0;
        text-align: center;
        text-decoration: none;
        color: #2e7d32;
        border: 1px solid #2e7d32;
        padding: 11px;
        border-radius: 9px;
        font-weight: bold;
    }

    .back:hover {
        background: #2e7d32;
        color: white;
    }

    .footer {
        text-align: center;
        margin-top: 25px;
        color: #999;
        font-size: 13px;
    }

    @media (max-width: 700px) {
        .header {
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        .grid {
            grid-template-columns: 1fr;
        }

        .full {
            grid-column: auto;
        }

        .form-card {
            padding: 25px 20px;
        }

        .title h1 {
            font-size: 30px;
        }
    }
</style>
```

</head>

<body>

```
<div class="header">
    <div class="brand">&#127860; FoodShare</div>
    <div class="role">DONOR</div>
</div>

<div class="container">

    <div class="title">
        <h1>Donate Food</h1>
        <p>Share surplus food and help someone in need.</p>
    </div>

    <div class="form-card">

        <form action="donateFood" method="post" enctype="multipart/form-data">

            <div class="section">
                <div class="section-title">Food Details</div>

                <div class="grid">

                    <div class="field">
                        <label for="food_name">Food Name</label>
                        <input
                            type="text"
                            id="food_name"
                            name="food_name"
                            placeholder="Example: Rice"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="quantity">Quantity</label>
                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="1"
                            placeholder="Enter quantity"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="food_type">Food Type</label>
                        <select id="food_type" name="food_type" required>
                            <option value="">Select Food Type</option>
                            <option value="Vegetarian">Vegetarian</option>
                            <option value="Non-Vegetarian">Non-Vegetarian</option>
                            <option value="Bakery">Bakery</option>
                            <option value="Fruits">Fruits</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="food_image">Food Photo</label>
                        <input
                            type="file"
                            id="food_image"
                            name="food_image"
                            accept="image/*"
                        >
                    </div>

                    <div class="field full">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="Add details about the food..."
                            rows="4"
                        ></textarea>
                    </div>

                </div>
            </div>

            <div class="section">
                <div class="section-title">Availability</div>

                <div class="grid">

                    <div class="field">
                        <label for="location">Location</label>
                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="Enter pickup location"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="available_until">Available Until</label>
                        <input
                            type="datetime-local"
                            id="available_until"
                            name="available_until"
                            required
                        >
                    </div>

                </div>
            </div>

            <div class="section">
                <div class="section-title">Donation Type</div>

                <div class="grid">

                    <div class="field">
                        <label for="donation_type">Donation Type</label>
                        <select
                            id="donation_type"
                            name="donation_type"
                            required
                        >
                            <option value="">Select Type</option>
                            <option value="FREE">Free Donation</option>
                            <option value="LOW_COST">Low-Cost Sale</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="price">Price</label>
                        <input
                            type="number"
                            id="price"
                            name="price"
                            min="0"
                            step="0.01"
                            placeholder="Enter price if applicable"
                        >
                        <div class="hint">
                            Leave as 0 for free donations.
                        </div>
                    </div>

                </div>
            </div>

            <button class="submit" type="submit">
                Donate Food
            </button>

        </form>

    </div>

    <a class="back" href="donor-dashboard.html">
        Back to Dashboard
    </a>

    <div class="footer">
        FoodShare © 2026
    </div>

</div>


</body>
</html>
